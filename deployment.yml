apiVersion: apps/v1 
Kind: Deployment 
metadata:
    name: java-app
    namespace: java-ns
    labels:
        app: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app
        image: dinahamza/depi-java:latest
        ports:
        - containerPort: 8090 